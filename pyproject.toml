[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskbooth-mcp"
version = "0.11.0"
description = "Task Booth — a Tollbooth DPYC Operator where work is posted with a signed rubric and paid in sats after it is graded"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Lonnie VanZandt" }]

dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tollbooth-dpyc[nostr]==0.127.0",
    # Time zone data for calendar feeds: a host image may carry none.
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# TRY004: a refusal is a ValueError here whatever was wrong with the input, so a
# tool has one exception to turn into a sentence for the caller.
ignore = ["E501", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-m testnut` runs the escrow against testnut.cashu.space (pretend sats); skipped otherwise.
addopts = "-m 'not testnut'"
markers = ["testnut: talks to the public Cashu test mint"]
